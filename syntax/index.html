<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimplyChat · Syntax</title>
  <link rel="stylesheet" href="/SimplyChat/style.css">
  <link rel="icon" href="/SimplyChat/logo.svg" type="image/svg+xml">
  <link rel="icon" href="/SimplyChat/SimplyChatLogo11May2026.png" type="image/png" sizes="32x32">
</head>
<body>
  <div id="title-container">
    <picture>
      <source srcset="https://raw.githubusercontent.com/SCLF-Xingshu/SimplyChat/master/logo.svg" type="image/svg+xml">
      <img src="https://raw.githubusercontent.com/SCLF-Xingshu/SimplyChat/master/SimplyChatLogo11May2026.png" alt="SimplyChat logo" class="title-icon">
    </picture>
    <h1><span class="title-highlight">SimplyChat.</span></h1>
  </div>

  <div id="navbar">
    <p>
      <a href="https://sclf-xingshu.github.io/SimplyChat/">Home</a> ·
      <a href="https://sclf-xingshu.github.io/SimplyChat/blog">Blog</a> ·
      <a href="https://sclf-xingshu.github.io/SimplyChat/create">Create</a> ·
      <a href="https://sclf-xingshu.github.io/SimplyChat/explore">Explore</a>
    </p>
  </div>
  
  <div id="search-row">
    <select id="room-mode">
      <option value="trending">Trending</option>
      <option value="popular">Popular</option>
      <option value="match">Best match</option>
    </select>
    <input type="text" id="room-search" placeholder="Search for a chatroom..." />
  </div>
  
  <div id="room-results"></div>
  
  <div id="font-size-controls">
    <label for="font-slider">Font size:</label>
    <input type="range" id="font-slider" min="10" max="40" value="20">
    <span id="font-size-display">20px</span>
  </div>
</body>
</html>
