<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="frame-ancestors *;">
  <title>SimplyChat · Syntax</title>
  <link rel="stylesheet" href="/SimplyChat/style.css">
  <link rel="icon" href="/SimplyChat/logo.svg" type="image/svg+xml">
  <link rel="icon" href="/SimplyChat/SimplyChatLogo11May2026.png" type="image/png" sizes="32x32">
  <!--<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>-->
  <script type="module" src="/SimplyChat/script.js"></script>
</head>
<body>
  <div id="chat-container" role="main">
    <header id="title-container">
      <picture>
        <source srcset="/SimplyChat/logo.svg" type="image/svg+xml">
        <img src="/SimplyChat/SimplyChatLogo11May2026.png" alt="SimplyChat logo" class="title-icon">
      </picture>
      <h1><span class="title-highlight">SimplyChat.</span></h1>
    </header>

    <div id="navbar">
      <p>
        <a href="/SimplyChat/" class="active">🏠 Home</a> ·
        <a href="/SimplyChat/blog">📝 Blog</a> ·
        <a href="/SimplyChat/create">✨ Create</a> ·
        <a href="/SimplyChat/explore">🔎 Explore</a>
      </p>
    </div>
    
    <div id="search-row">
      <select id="room-mode">
        <option value="trending">Trending</option>
        <option value="popular">Popular</option>
        <option value="match">Best match</option>
      </select>
      <input type="text" id="room-search" placeholder="Search for a chatroom..." />
    </div>
    
    <div id="room-results"></div>
    
    <section id="settings-container" aria-label="Settings">
      <button id="settings-toggle" aria-label="Toggle settings" aria-expanded="false" aria-controls="settings-panel">
        <img src="/SimplyChat/icons/settings.svg" alt="" width="30" height="30">
      </button>
      <div id="settings-panel" style="display: none;">
        <strong style="font-size: 20px;">Settings</strong><br>
        <label for="font-slider">Font size:</label>
        <input type="range" id="font-slider" min="10" max="40" value="20">
        <span id="font-size-display">20px</span>
      </div>
    </section>
  </div>
  <footer>
    <p>
      Copyright © 2026, SCLF-Xingshu.
      <br>Licensed under <a class="simple-link" href="https://github.com/SCLF-Xingshu/SimplyChat/blob/master/LICENSE" target="_blank" rel="noopener noreferrer">BSD 3-Clause ↗</a>.
    </p>
  </footer>
</body>
</html>
