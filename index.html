<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimplyChat.</title>
  <link rel="stylesheet" href="/SimplyChat/style.css">
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>
  <div id="chat-container">
    <h1>SimplyChat.</h1>
    <p><a href="https://sclf-xingshu.github.io/SimplyChat/">Home</a> / <a href="https://sclf-xingshu.github.io/SimplyChat/blog">Blog</a></p>
    <p>Just a chat. Simple.</p>
    <div id="messages"></div>
      <input type="text" id="username" placeholder="Username" />
      <button id="github-login">Login with GitHub</button>
    <div id="input-container">
      <textarea id="message" placeholder="Write a message" maxlength="1000"></textarea>
      <button id="send">Send</button>
    </div>
    <div id="char-count">0 / 1000</div>
  </div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

// Supabase setup
const supabaseUrl = 'https://koprmimlvjziuznbntzc.supabase.co'
const supabaseKey = 'YOUR_ANON_KEY'
const supabase = createClient(supabaseUrl, supabaseKey)


// RoomId setup  
const parts = window.location.pathname.split('/')

let roomId

if (parts[2] === 'chat' && parts[3]) {
  roomId = parts[3]
} else {
  roomId = 'global'
}

// Dynamic title (using the RoomId)
if (roomId === 'global') {
  document.title = 'SimplyChat'
} else {
  document.title = 'SimplyChat / ' + roomId
}

// Redirects
const redirect = sessionStorage.getItem('redirect')

if (redirect) {
  sessionStorage.removeItem('redirect')
  window.history.replaceState({}, '', redirect)
}


// DOM elements
const messagesDiv = document.getElementById('messages')
const usernameInput = document.getElementById('username')
const messageInput = document.getElementById('message')
const charCount = document.getElementById('char-count')
const sendBtn = document.getElementById('send')
const githubLoginBtn = document.getElementById('github-login')

let currentUser = null

// Character counter
messageInput.addEventListener('input', () => { 
  charCount.textContent = `${messageInput.value.length} / 1000`
})

// Add message
function addMessage(msg) {
  const div = document.createElement('div')
  div.classList.add('message')
  const date = new Date(msg.created_at)
  const day = String(date.getDate()).padStart(2,'0')
  const month = String(date.getMonth() + 1).padStart(2,'0')
  const year = date.getFullYear()
  const hours = String(date.getHours()).padStart(2,'0')
  const minutes = String(date.getMinutes()).padStart(2,'0')
  const tzParts = date.toLocaleTimeString(undefined, { timeZoneName: 'short' }).split(' ')
  const tz = tzParts[tzParts.length - 1] || ''
  
  // Two-line format: timestamp first, then username + message
  // Sanitize plain text and convert line breaks
  let safeText = DOMPurify.sanitize(msg.content)
  safeText = safeText.replace(/\n/g, '<br>')

  div.innerHTML = `
    <div class="msg-header">[${day}/${month}/${year} ${hours}:${minutes} ${tz}] ${msg.username}:</div>
    <div class="msg-content">${safeText}</div>
  `
  
  messagesDiv.appendChild(div)
  messagesDiv.scrollTop = messagesDiv.scrollHeight
}

// Load existing messages
async function loadMessages() {

  let query = supabase
    .from('simplychat_messages')
    .select('*')
    .order('created_at', { ascending: true })

  if (roomId === 'global') {
    query = query.eq('room_id', 'global')
  } else {
    query = query.eq('room_id', roomId)
  }

  const { data: messages, error } = await query
  
  if (error) {
    console.error('Error loading messages:', error)
  } else {
    messages.forEach(addMessage)
  }
}

loadMessages()

// Real-time listener
const chatChannel = supabase
  .channel('room:' + roomId)
  .on('postgres_changes', {
    event: 'INSERT',
    schema: 'public',
    table: 'simplychat_messages',
    filter: `room_id=eq.${roomId}`
  }, payload => {
    addMessage(payload.new)
  })
  .subscribe()

// Send message
sendBtn.addEventListener('click', async () => {
  let username = 'Anonymous'

  // If user logged in with GitHub, use GitHub username
  if (currentUser) { 
    username = `[GH] ${currentUser.user_metadata.user_name}` 
  } else {
    // Otherwise, use input field or default to "Anonymous"
    username = usernameInput.value.trim() || 'Anonymous'
  }
  
  const content = messageInput.value.trim()
  if (!content) return // ignore empty messages
  if (content.length > 1000) {
    alert('Your message exceeds 1000 characters')
    return
  }

  // Insert message into Supabase
  const { error } = await supabase.from('simplychat_messages').insert([{
    username,
    content,
    room_id: roomId
  }])

  if (error) {
    console.error('Error inserting message:', error)
  } else {
    // Clear input and reset character counter
    messageInput.value = ''
    charCount.textContent = '0 / 1000'
  }
})

// GitHub login
githubLoginBtn.addEventListener('click', async () => {
  // Redirects to Supabase callback URL, then back to GitHub Pages
  await supabase.auth.signInWithOAuth({
    provider: 'github',
    options: { redirectTo: 'https://sclf-xingshu.github.io/SimplyChat/' }
  })
})

// Check user session after redirect
async function checkUser() {
  // Get session from URL hash if user just logged in
  const { data: { session }, error } = await supabase.auth.getSessionFromUrl({ storeSession: true })
  if (error) {
    console.error('Error getting session from URL:', error)
  }

  currentUser = session?.user || null

  if (currentUser) {
    const githubUsername = currentUser.user_metadata.user_name
    // Pre-fill username input with GitHub username and disable editing
    usernameInput.value = `[GH] ${githubUsername}`
    usernameInput.disabled = true
  }

  // Remove hash from URL to clean it
  if (window.location.hash) {
    history.replaceState(null, '', window.location.pathname)
  }
}

checkUser()

// Listen for auth state changes
supabase.auth.onAuthStateChange((_event, session) => {
  if (session) {
    currentUser = session.user
    const githubUsername = currentUser.user_metadata.user_name
    // Update username input on auth change
    usernameInput.value = `[GH] ${githubUsername}`
    usernameInput.disabled = true
  }
})
</script>
</body>
</html>
