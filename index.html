<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimplyChat.</title>
  <link rel="stylesheet" href="/SimplyChat/style.css">
  <link rel="icon" href="/SimplyChat/logo.svg" type="image/svg+xml">
  <link rel="icon" href="/SimplyChat/SimplyChatLogo11May2026.png" type="image/png" sizes="32x32">
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script type="module" src="/SimplyChat/script.js"></script>
</head>

<body>
  <div id="chat-container">
    <div id="title-container">
      <img src="https://raw.githubusercontent.com/SCLF-Xingshu/SimplyChat/refs/heads/master/SimplyChatLogo11May2026.png" class="title-icon" alt="SimplyChat logo"> <h1><span class="title-highlight">SimplyChat.</span></h1>
    </div>

    <p><a href="https://sclf-xingshu.github.io/SimplyChat/">Home</a> · <a href="https://sclf-xingshu.github.io/SimplyChat/blog">Blog</a></p>
    <p>Just a chat. Simple.</p>

    <div id="font-size-controls">
      <label for="font-slider">Font size:</label>
      <input type="range" id="font-slider" min="10" max="40" value="20">
      <span id="font-size-display">20px</span>
    </div>

    <div id="messages"></div>

    <input type="text" id="username" placeholder="Username" />
    <button id="github-login">Login with GitHub</button>

    <div id="input-container">
      <textarea id="message" placeholder="Write a message" maxlength="1000"></textarea>
      <button id="send">Send</button>
    </div>

    <div id="char-count">0 / 1000</div>
  </div>
</body>
</html>
